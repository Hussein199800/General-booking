# Local development infrastructure. Everything here is self-hostable on-premise;
# no service depends on a foreign cloud provider.
#
#   docker compose up -d                     # Postgres, Redis, MinIO, Mailpit
#   docker compose --profile jitsi up -d     # + self-hosted Jitsi Meet
#
# All ports bind to 127.0.0.1 only. Credentials come from the root .env file.

name: sba

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Password of the least-privilege runtime role (infra/postgres/init/02-roles.sh).
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so queued notification / reschedule jobs survive a restart.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --appendonly yes
      --maxmemory-policy noeviction
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER_REDIRECT: 'false'
    ports:
      - 127.0.0.1:${MINIO_API_PORT:-9000}:9000
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the private documents bucket and a least-privilege
  # service account for the API (it never uses the MinIO root credentials).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-sba-documents}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set MINIO_APP_ACCESS_KEY in .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY in .env}
    entrypoint: [/bin/sh, /init/minio-init.sh]
    volumes:
      - ./infra/minio:/init:ro
    restart: 'no'

  # Development SMTP sink for the EmailProvider (UI on http://127.0.0.1:8025).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025

  # ---------------------------------------------------------------------------
  # Optional: self-hosted Jitsi Meet (default MeetingProvider). Enable with
  # `--profile jitsi`. Pin JITSI_IMAGE_VERSION to a tested stable tag.
  # ---------------------------------------------------------------------------
  jitsi-web:
    profiles: [jitsi]
    image: jitsi/web:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${JITSI_HTTP_PORT:-8000}:80
      - 127.0.0.1:${JITSI_HTTPS_PORT:-8443}:443
    environment: &jitsi-env
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-https://localhost:8443}
      TZ: Asia/Damascus
      ENABLE_AUTH: '1'
      AUTH_TYPE: jwt
      JWT_APP_ID: ${JITSI_JWT_APP_ID:-sba}
      JWT_APP_SECRET: ${JITSI_JWT_APP_SECRET:-}
      ENABLE_GUESTS: '0'
      ENABLE_LOBBY: '1'
      ENABLE_PREJOIN_PAGE: '1'
      DISABLE_THIRD_PARTY_REQUESTS: '1'
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:-}
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:-}
    volumes:
      - jitsi-web-config:/config
    networks:
      default:
      jitsi:
        aliases: [meet.jitsi]

  jitsi-prosody:
    profiles: [jitsi]
    image: jitsi/prosody:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    environment: *jitsi-env
    volumes:
      - jitsi-prosody-config:/config
    networks:
      jitsi:
        aliases: [xmpp.meet.jitsi]

  jitsi-jicofo:
    profiles: [jitsi]
    image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    environment: *jitsi-env
    depends_on: [jitsi-prosody]
    networks: [jitsi]

  jitsi-jvb:
    profiles: [jitsi]
    image: jitsi/jvb:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    ports:
      - ${JITSI_JVB_PORT:-10000}:10000/udp
    environment:
      <<: *jitsi-env
      JVB_ADVERTISE_IPS: ${JITSI_JVB_ADVERTISE_IPS:-127.0.0.1}
    depends_on: [jitsi-prosody]
    networks: [jitsi]

networks:
  default:
  jitsi:

volumes:
  postgres-data:
  redis-data:
  minio-data:
  jitsi-web-config:
  jitsi-prosody-config:
